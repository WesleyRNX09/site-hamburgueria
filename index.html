    <title>Cardápio e pedidos online</title>
    <script>
      /* Cardápio, painel do estabelecimento e garçom são claros; só o
         superadmin é escuro. Marcar a área antes do React montar evita o pisca
         de paleta. O AppProvider mantém isso atualizado a cada troca de rota
         (mesma regra de areaDoTema, em src/utils/theme.js). */
      document.documentElement.dataset.area =
        /^\/superadmin(\/|$)/.test(location.pathname) ? 'painel'
          : /^\/garcom(\/|$)/.test(location.pathname) ? 'garcom'
            : /^\/admin(\/|$)/.test(location.pathname) ? 'admin' : 'publica';
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
