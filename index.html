    <script>
      /* Só o cardápio acompanha o claro/escuro do aparelho; painel, garçom e
         superadmin continuam escuros. Marcar a área antes do React montar evita
         o pisca escuro em quem está no modo claro. O AppProvider mantém isso
         atualizado a cada troca de rota. */
      document.documentElement.dataset.area =
        /^\/(admin|superadmin|garcom)(\/|$)/.test(location.pathname) ? 'painel' : 'publica';
    </script>
