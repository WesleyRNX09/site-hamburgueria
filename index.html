    <title>Cardápio e pedidos online</title>
    <script>
      /* O cardápio é claro; painel, garçom e superadmin são escuros. Marcar a
         área antes do React montar evita o pisca escuro no cardápio. O
         AppProvider mantém isso atualizado a cada troca de rota. */
      document.documentElement.dataset.area =
        /^\/(admin|superadmin|garcom)(\/|$)/.test(location.pathname) ? 'painel' : 'publica';
    </script>

    <div id="root"></div>
