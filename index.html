    <title>Cardápio e pedidos online</title>
    <script>
      /* Cardápio e painel do estabelecimento são claros; garçom e superadmin
         são escuros. Marcar a área antes do React montar evita o pisca de
         paleta. O AppProvider mantém isso atualizado a cada troca de rota. */
      document.documentElement.dataset.area =
        /^\/(superadmin|garcom)(\/|$)/.test(location.pathname) ? 'painel'
          : /^\/admin(\/|$)/.test(location.pathname) ? 'admin' : 'publica';
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
